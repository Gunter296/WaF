id: waf-lab-bot-normal-profile

info:
  name: WAF Lab - normal browser profile
  author: waf-lab
  severity: info
  description: Two ordinary valid requests with a browser-style User-Agent; this tests the lab heuristic only and does not prove human identity.
  tags: behavior,bot,benign,waf-lab

http:
  - method: GET
    headers:
      User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/132.0.0.0 Safari/537.36
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/api/lab/search?q=C%C3%A0%20ph%C3%AA"
    stop-at-first-match: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
