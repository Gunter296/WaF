global
    log filebeat:5140 format raw local0
    maxconn 256

defaults
    mode http
    log global
    #option httplog
    option http-keep-alive
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout check 2s
    retries 2
    #log-format '{"event":{"dataset":"haproxy.access","action":"request"},"http":{"request":{"id":"%ID","method":"%HM"},"response":{"status_code":%ST}},"source":{"ip":"%ci"},"url":{"path":"%[path]"},"lab":{"route":"%[srv_name,map_str(/usr/local/etc/haproxy/route.map,unknown)]","backend":"%b","server":"%s"}}'

frontend lab_http
    bind :8080
    # Classify the route from the selected server at log time. This remains
    # consistent with server/backend even when health checks change during a request.
    log-format '{"event":{"dataset":"haproxy.access","action":"request"},"http":{"request":{"id":"%ID","method":"%HM"},"response":{"status_code":%ST}},"source":{"ip":"%ci"},"url":{"path":"%HPO"},"lab":{"route":"%[srv_name,map_str(/usr/local/etc/haproxy/route.map,unknown)]","backend":"%b","server":"%s"}}'
    unique-id-format %{+X}o\ %ci:%cp_%fi:%fp_%Ts_%rt
    http-request set-var(txn.request_id) unique-id
    http-request set-header X-Request-ID %[var(txn.request_id)]
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    http-response set-header X-Request-ID %[var(txn.request_id)]
    acl host_patched hdr(host) -i patched.localhost patched.localhost:8080
    acl host_direct hdr(host) -i direct.localhost direct.localhost:8080
    use_backend finance_direct if host_direct
    use_backend finance_patched_waf if host_patched
    default_backend finance_waf_with_fallback

backend finance_waf_with_fallback
    option httpchk GET /healthz
    http-check expect status 200
    server waf waf:8080 check inter 2s fall 3 rise 2
    server finance-fallback finance-vulnerable:3000 check inter 2s fall 3 rise 2 backup
    #mailers lab_mailers
    #email-alert mailers lab_mailers
    #email-alert from waf-lab@localhost
    #email-alert to admin@localhost
    #email-alert level notice

backend finance_patched_waf
    server waf waf:8080 check inter 2s fall 3 rise 2

backend finance_direct
    server finance finance-vulnerable:3000 check

#mailers lab_mailers
#    mailer smtp mailpit:1025
