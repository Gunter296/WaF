# Lab-only Coraza limits and event log. Engine mode and CRS load order are in
# lab/waf/Caddyfile. This file does not alter the original Coraza configuration.
SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject
SecAuditEngine RelevantOnly
SecAuditLog /var/log/lab/coraza-audit.jsonl
SecAuditLogFormat JSON
SecAuditLogParts ABCEFHKZ
SecDebugLog /var/log/lab/coraza-debug.log
SecDebugLogLevel 3
