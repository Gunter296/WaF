# Static lab rules. The portal changes policy.json; it does not rewrite this file.
# The pre-Coraza policy module removes client-supplied X-Lab-* controls and
# sets only the values allowed by the current policy.
SecRuleEngine On

# Runtime mode and CRS paranoia levels.
SecRule REQUEST_HEADERS:X-Lab-Mode "@streq DetectionOnly" "id:100001,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"
SecRule REQUEST_HEADERS:X-Lab-Blocking-PL "@rx ^[1-4]$" "id:100002,phase:1,pass,nolog,setvar:tx.blocking_paranoia_level=%{MATCHED_VAR}"
SecRule REQUEST_HEADERS:X-Lab-Detection-PL "@rx ^[1-4]$" "id:100003,phase:1,pass,nolog,setvar:tx.executing_paranoia_level=%{MATCHED_VAR}"

# Narrow exception: remove only CRS rule 942100 on the search fixture route.
SecRule REQUEST_HEADERS:X-Lab-Exclude-SQLi-942100 "@streq on" "id:100020,phase:1,pass,nolog,chain,ctl:ruleRemoveById=942100,msg:'WAF lab narrow CRS exception for SQLi fixture'"
SecRule REQUEST_FILENAME "@streq /api/lab/search" "t:none"

# Virtual patches apply only to the designated CVE fixture routes.
SecRule REQUEST_HEADERS:X-Lab-CVE-64642 "@streq on" "id:100010,phase:1,deny,status:403,log,chain,msg:'WAF lab virtual patch CVE-2026-64642'"
SecRule REQUEST_URI "@beginsWith /en/account/private" "t:none"
SecRule REQUEST_HEADERS:X-Lab-CVE-64645 "@streq on" "id:100011,phase:1,deny,status:403,log,chain,msg:'WAF lab virtual patch CVE-2026-64645'"
SecRule REQUEST_URI "@beginsWith /lab/ssrf/" "t:none"
