# Static lab rules. The portal changes policy.json; it does not rewrite this file.
# The pre-Coraza policy module removes client-supplied X-Lab-* controls and
# sets only the values allowed by the current policy.
SecRuleEngine On

# Runtime mode and CRS paranoia levels.
SecRule REQUEST_HEADERS:X-Lab-Mode "@streq DetectionOnly" "id:100001,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"
SecRule REQUEST_HEADERS:X-Lab-Blocking-PL "@rx ^[1-4]$" "id:100002,phase:1,pass,nolog,setvar:tx.blocking_paranoia_level=%{MATCHED_VAR}"
SecRule REQUEST_HEADERS:X-Lab-Detection-PL "@rx ^[1-4]$" "id:100003,phase:1,pass,nolog,setvar:tx.executing_paranoia_level=%{MATCHED_VAR}"

# Narrow exception: remove only CRS rule 942100 on the search fixture route.
SecRule REQUEST_HEADERS:X-Lab-Exclude-SQLi-942100 "@streq on" "id:100020,phase:1,pass,nolog,chain,ctl:ruleRemoveById=942100,msg:'WAF lab narrow CRS exception for SQLi fixture'"
SecRule REQUEST_FILENAME "@streq /api/lab/search" "t:none"

# Virtual patches apply only to the designated CVE fixture routes.
SecRule REQUEST_HEADERS:X-Lab-CVE-64642 "@streq on" "id:100010,phase:1,deny,status:403,log,chain,msg:'WAF lab virtual patch CVE-2026-64642'"
SecRule REQUEST_URI "@beginsWith /en/account/private" "t:none"
SecRule REQUEST_HEADERS:X-Lab-CVE-64645 "@streq on" "id:100011,phase:1,deny,status:403,log,chain,msg:'WAF lab virtual patch CVE-2026-64645'"
SecRule REQUEST_URI "@beginsWith /lab/ssrf/" "t:none"

# Positive security fixture: one exact JSON endpoint with a narrow method,
# media type, parameter-name, value and filename allowlist. XML is unsupported
# because no lab endpoint consumes XML.
SecRule REQUEST_URI "@rx ^/api/lab/positive(?:/|\?|$)" "id:100040,phase:1,deny,status:403,log,chain,msg:'Positive policy rejected URL'"
SecRule REQUEST_FILENAME "!@streq /api/lab/positive" "t:none"
SecRule REQUEST_FILENAME "@streq /api/lab/positive" "id:100041,phase:1,deny,status:403,log,chain,msg:'Positive policy rejected HTTP method',chain"
SecRule REQUEST_METHOD "!@streq POST" "t:none"
SecRule REQUEST_FILENAME "@streq /api/lab/positive" "id:100042,phase:1,deny,status:403,log,msg:'Positive policy rejected content type',chain"
SecRule REQUEST_HEADERS:Content-Type "!@rx (?i)^application/json(?:\s*;|$)" "t:none"
SecRule REQUEST_FILENAME "@streq /api/lab/positive" "id:100043,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQBODY_ERROR "@eq 1" "id:100044,phase:2,deny,status:403,log,msg:'Positive policy rejected invalid JSON body'"
SecRule REQUEST_FILENAME "@streq /api/lab/positive" "id:100045,phase:2,deny,status:403,log,msg:'Positive policy rejected JSON parameter',chain"
SecRule ARGS_NAMES "!@rx (?:^|[.:])(?:action|reference|filename)$" "t:none"
SecRule ARGS_POST:json.action "!@streq lookup" "id:100046,phase:2,deny,status:403,log,msg:'Positive policy rejected JSON action'"
SecRule ARGS_POST:json.reference "!@streq LAB-1001" "id:100047,phase:2,deny,status:403,log,msg:'Positive policy rejected JSON reference'"
SecRule ARGS_POST:json.filename "!@rx (?i)\.(pdf|txt)$" "id:100048,phase:2,deny,status:403,log,msg:'Positive policy rejected file type'"
