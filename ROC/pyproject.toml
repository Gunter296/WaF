[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crs-threshold-evaluation"
version = "0.1.0"
description = "Reproducible offline request-level threshold evaluation for Coraza and OWASP CRS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<4", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
crs-eval = "crs_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

